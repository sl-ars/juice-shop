name: Build
on:
  push:  
    branches: ["appsec-lab9-ci"]
  pull_request:
    branches: ["master"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          if [ -f yarn.lock ]; then
            npm i -g yarn
            yarn install --frozen-lockfile
          else
            npm ci || npm i
          fi
      - name: Build
        run: |
          if [ -f yarn.lock ]; then
            yarn run build || true
          else
            npm run build --if-present
          fi
      - name: Test
        run: |
          if [ -f yarn.lock ]; then
            yarn run test || true
          else
            npm test --if-present
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            coverage/**
            npm-debug.log
          if-no-files-found: ignore
